<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">mmdverse system map</title>
  <desc id="desc">A visual map of Persian developer experience, AI workflows, and Telegram automation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#239f40"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#da0000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#surface)"/>
  <rect x="52" y="52" width="7" height="396" rx="3.5" fill="url(#flag)"/>
  <g fill="none" stroke="#344054" stroke-width="2">
    <path d="M402 249H525"/>
    <path d="M676 249H799"/>
    <path d="M600 171V106H940"/>
    <path d="M600 329V394H940"/>
  </g>
  <g fill="#101828" stroke="#475467" stroke-width="2">
    <rect x="118" y="176" width="284" height="146" rx="20"/>
    <rect x="799" y="49" width="326" height="114" rx="20"/>
    <rect x="799" y="337" width="326" height="114" rx="20"/>
  </g>
  <circle cx="600" cy="249" r="77" fill="#172554" stroke="#7dd3fc" stroke-width="2" filter="url(#glow)"/>
  <circle cx="600" cy="249" r="60" fill="#0f172a"/>
  <text x="118" y="115" fill="#98a2b3" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">MMDVERSE / SYSTEM MAP</text>
  <text x="118" y="225" fill="#f9fafb" font-family="Arial, sans-serif" font-size="31" font-weight="700">Build with intent.</text>
  <text x="118" y="260" fill="#98a2b3" font-family="Arial, sans-serif" font-size="18">Practical tools for real workflows,</text>
  <text x="118" y="286" fill="#98a2b3" font-family="Arial, sans-serif" font-size="18">not disposable demos.</text>
  <text x="600" y="244" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="21" font-weight="700">MMD</text>
  <text x="600" y="270" text-anchor="middle" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">BUILD / SHIP</text>
  <text x="831" y="95" fill="#86efac" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">PERSIAN DX</text>
  <text x="831" y="126" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">RTL · UI quality · tooling</text>
  <text x="831" y="382" fill="#fca5a5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">AUTOMATION</text>
  <text x="831" y="414" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">AI workflows · Telegram</text>
  <circle cx="525" cy="249" r="5" fill="#7dd3fc"/>
  <circle cx="676" cy="249" r="5" fill="#7dd3fc"/>
  <circle cx="940" cy="106" r="5" fill="#86efac"/>
  <circle cx="940" cy="394" r="5" fill="#fca5a5"/>
</svg>
