    <text x="48" y="108" fill="#f8fafc" font-family="Arial, sans-serif" font-size="33" font-weight="700">Smart Contracts</text>
    <text x="48" y="137" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">multisig · escrow · upgradeable flows</text>
    <text x="48" y="178" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.4">OPEN PROJECT  ↗</text>
