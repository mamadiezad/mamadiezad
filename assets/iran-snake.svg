<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 900 180" style="background: transparent;">
  <defs>
    <!-- Flag Gradients -->
    <linearGradient id="greenBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#239F40"/>
      <stop offset="100%" stop-color="#1B7A32"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DA0000"/>
      <stop offset="100%" stop-color="#B30000"/>
    </linearGradient>

    <!-- Gold Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFA500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#FFF4A0"/>
      <stop offset="60%" stop-color="#FFC125"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>

    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="25%" stop-color="#FFF4A0"/>
      <stop offset="50%" stop-color="#FFC125"/>
      <stop offset="75%" stop-color="#FFF4A0"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="superGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="flagClip">
      <rect x="0" y="0" width="900" height="180" rx="12"/>
    </clipPath>

    <!-- Snake motion path -->
    <path id="snakeTrack" d="M-50,130 Q-25,120 -10,110 Q5,100 20,105 Q35,110 50,100 Q65,90 80,95 Q95,100 110,90 Q125,80 140,85 Q155,90 170,80 Q185,70 200,75 Q215,80 230,70 Q245,60 260,65 Q275,70 290,60 Q305,50 320,55 Q335,60 350,50 Q365,40 380,45 Q395,50 410,40 Q425,30 440,35 Q455,40 470,30 Q485,20 500,25 Q515,30 530,20 Q545,10 560,15 Q575,20 590,10 Q605,0 620,5 Q635,10 650,0 Q665,-10 680,-5 Q695,0 710,-10 Q725,-20 740,-15 Q755,-10 770,-20 Q785,-30 800,-25 Q815,-20 830,-30 Q845,-40 860,-35 Q875,-30 890,-40 Q905,-50 920,-45 L960,-45"/>

    <!-- Contribution grid pattern -->
    <pattern id="gridPattern" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" rx="2" fill="none" stroke="rgba(255,215,0,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Main container -->
  <g clip-path="url(#flagClip)" filter="url(#shadow)">
    <!-- Background -->
    <rect x="0" y="0" width="900" height="180" rx="12"/>

    <!-- IRAN FLAG STRIPES -->
    <rect x="0" y="0" width="900" height="60" fill="url(#greenBar)"/>
    <rect x="0" y="60" width="900" height="60" fill="#FFFFFF"/>
    <rect x="0" y="120" width="900" height="60" fill="url(#redBar)"/>

    <!-- Grid overlay -->
    <rect x="0" y="0" width="900" height="180" fill="url(#gridPattern)" opacity="0.6"/>

    <!-- ====== LION AND SUN EMBLEM ====== -->
    <g transform="translate(450, 90)" filter="url(#superGlow)">
      <!-- Pulsing glow -->
      <circle cx="0" cy="0" r="36" fill="url(#goldGlow)">
        <animate attributeName="r" values="34;40;34" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Sun rays -->
      <g opacity="0.8">
        <line x1="0" y1="-26" x2="0" y2="-40" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
          <animate attributeName="y2" values="-40;-44;-40" dur="2s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="26" x2="0" y2="40" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
          <animate attributeName="y2" values="40;44;40" dur="2s" repeatCount="indefinite"/>
        </line>
        <line x1="-26" y1="0" x2="-40" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="26" y1="0" x2="40" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-18" y1="-18" x2="-28" y2="-28" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
          <animate attributeName="x2" values="-28;-32;-28" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="-28;-32;-28" dur="2.5s" repeatCount="indefinite"/>
        </line>
        <line x1="18" y1="-18" x2="28" y2="-28" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
        <line x1="-18" y1="18" x2="-28" y2="28" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
        <line x1="18" y1="18" x2="28" y2="28" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
        <!-- Small rays -->
        <line x1="-13" y1="-13" x2="-20" y2="-20" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.5"/>
        <line x1="13" y1="-13" x2="20" y2="-20" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.5"/>
        <line x1="-13" y1="13" x2="-20" y2="20" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.5"/>
        <line x1="13" y1="13" x2="20" y2="20" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.5"/>
      </g>

      <!-- Sun face -->
      <circle cx="0" cy="-5" r="9" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.5" opacity="0.9"/>

      <!-- LION -->
      <g transform="translate(0, 5)">
        <!-- Body -->
        <path d="M-5,-2 Q-9,4 -7,12 Q-5,15 0,17 Q5,15 7,12 Q9,4 5,-2 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.5"/>
        <!-- Head -->
        <ellipse cx="-6" cy="-6" rx="5.5" ry="4.5" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.5"/>
        <!-- Mane -->
        <path d="M-11,-8 Q-14,-12 -10,-14 Q-7,-16 -4,-13 Q-2,-11 -5,-8 Z" fill="#DAA520" stroke="#B8860B" stroke-width="0.3" opacity="0.8"/>
        <!-- Eye -->
        <circle cx="-8" cy="-7" r="1" fill="#1a1a1a"/>
        <!-- Raised paw -->
        <path d="M-3,-4 Q-1,-8 2,-10 L1,-9 Q-1,-7 -2,-4 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.3"/>
        <!-- Leg -->
        <path d="M-3,10 Q-3,15 -2,17 Q-1,18 0,17 Q1,16 1,15" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.5"/>
        <!-- Tail -->
        <path d="M4,8 Q8,6 10,2 Q12,-1 14,1 Q13,4 11,5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Sword -->
        <line x1="2" y1="-10" x2="8" y2="-19" stroke="#FFF4A0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="6" y1="-18" x2="10" y2="-17" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ====== CONTRIBUTION DOTS ====== -->
    <!-- Dots that the snake eats (green zone) -->
    <g opacity="0.5">
      <circle cx="60" cy="50" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="45" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="55" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="42" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="48" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="52" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="44" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="50" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="46" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="50" r="2.5" fill="#239F40"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Dots (white zone) -->
    <g opacity="0.5">
      <circle cx="70" cy="82" r="2.5" fill="#888"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="78" r="2.5" fill="#888"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="85" r="2.5" fill="#888"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="75" r="2.5" fill="#888"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="80" r="2.5" fill="#888"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="82" r="2.5" fill="#888"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="76" r="2.5" fill="#888"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="84" r="2.5" fill="#888"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="78" r="2.5" fill="#888"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Dots (red zone) -->
    <g opacity="0.5">
      <circle cx="80" cy="118" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="110" cy="112" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="120" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="115" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="122" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="118" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="112" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="120" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="114" r="2.5" fill="#DA0000"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ====== GOLDEN SNAKE ====== -->
    <g filter="url(#glow)">
      <!-- Snake outer glow -->
      <path d="M-50,130 Q-25,120 -10,110 Q5,100 20,105 Q35,110 50,100 Q65,90 80,95 Q95,100 110,90 Q125,80 140,85 Q155,90 170,80 Q185,70 200,75 Q215,80 230,70 Q245,60 260,65 Q275,70 290,60 Q305,50 320,55 Q335,60 350,50 Q365,40 380,45 Q395,50 410,40 Q425,30 440,35 Q455,40 470,30 Q485,20 500,25 Q515,30 530,20 Q545,10 560,15 Q575,20 590,10 Q605,0 620,5 Q635,10 650,0 Q665,-10 680,-5 Q695,0 710,-10 Q725,-20 740,-15 Q755,-10 770,-20 Q785,-30 800,-25 Q815,-20 830,-30 Q845,-40 860,-35 Q875,-30 890,-40 Q905,-50 920,-45 L960,-45"
            fill="none" stroke="#FFD700" stroke-width="12" stroke-linecap="round" opacity="0.25">
        <animate attributeName="stroke-dashoffset" from="2000" to="0" dur="7s" repeatCount="indefinite"/>
      </path>

      <!-- Snake body -->
      <path d="M-50,130 Q-25,120 -10,110 Q5,100 20,105 Q35,110 50,100 Q65,90 80,95 Q95,100 110,90 Q125,80 140,85 Q155,90 170,80 Q185,70 200,75 Q215,80 230,70 Q245,60 260,65 Q275,70 290,60 Q305,50 320,55 Q335,60 350,50 Q365,40 380,45 Q395,50 410,40 Q425,30 440,35 Q455,40 470,30 Q485,20 500,25 Q515,30 530,20 Q545,10 560,15 Q575,20 590,10 Q605,0 620,5 Q635,10 650,0 Q665,-10 680,-5 Q695,0 710,-10 Q725,-20 740,-15 Q755,-10 770,-20 Q785,-30 800,-25 Q815,-20 830,-30 Q845,-40 860,-35 Q875,-30 890,-40 Q905,-50 920,-45 L960,-45"
            fill="none" stroke="url(#snakeBody)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dashoffset" from="2000" to="0" dur="7s" repeatCount="indefinite"/>
      </path>

      <!-- Snake scales pattern -->
      <path d="M-50,130 Q-25,120 -10,110 Q5,100 20,105 Q35,110 50,100 Q65,90 80,95 Q95,100 110,90 Q125,80 140,85 Q155,90 170,80 Q185,70 200,75 Q215,80 230,70 Q245,60 260,65 Q275,70 290,60 Q305,50 320,55 Q335,60 350,50 Q365,40 380,45 Q395,50 410,40 Q425,30 440,35 Q455,40 470,30 Q485,20 500,25 Q515,30 530,20 Q545,10 560,15 Q575,20 590,10 Q605,0 620,5 Q635,10 650,0 Q665,-10 680,-5 Q695,0 710,-10 Q725,-20 740,-15 Q755,-10 770,-20 Q785,-30 800,-25 Q815,-20 830,-30 Q845,-40 860,-35 Q875,-30 890,-40 Q905,-50 920,-45 L960,-45"
            fill="none" stroke="#FFF4A0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,8" opacity="0.6">
        <animate attributeName="stroke-dashoffset" from="2000" to="0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ====== EATING EFFECT ====== -->
    <!-- Golden dots disappearing as snake eats them -->
    <g>
      <circle cx="80" cy="88" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.05;0.12;0.18" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.05;0.12;0.18" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="82" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.15;0.22;0.28" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.15;0.22;0.28" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="70" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.28;0.35;0.42" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.28;0.35;0.42" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="52" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.40;0.48;0.55" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.40;0.48;0.55" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="42" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.53;0.60;0.67" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.53;0.60;0.67" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="28" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.65;0.72;0.78" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.65;0.72;0.78" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="14" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.76;0.83;0.88" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.76;0.83;0.88" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="2" r="4" fill="#FFD700" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.86;0.92;0.97" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;8;0" keyTimes="0;0.86;0.92;0.97" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
