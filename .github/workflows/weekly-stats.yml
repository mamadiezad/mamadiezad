name: 📊 Update Profile Stats

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update last active date
        run: |
          echo "Profile auto-updated: $(date -u '+%Y-%m-%d %H:%M UTC')" > .last-updated
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Weekly profile auto-update [skip ci]"
          commit_user_name: "mamadiezad"
          commit_user_email: "mamadiezad@github.com"
          file_pattern: .last-updated
