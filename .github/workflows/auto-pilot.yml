name: 🤖 Auto-Pilot Weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      project_number:
        description: 'Project ID (0-9) or random'
        required: false
        default: '-1'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Auto-Pilot Script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          chmod +x auto-pilot.sh
          bash auto-pilot.sh

      - name: Log
        run: |
          echo "Auto-Pilot ran on $(date)" >> .auto-pilot-log
          git add .auto-pilot-log 2>/dev/null || true
          git diff --staged --quiet || git -c user.name="mamadiezad" -c user.email="mamadiezad@github.com" commit -m "Auto-Pilot log [skip ci]"
          git push 2>/dev/null || true
