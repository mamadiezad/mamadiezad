name: 🐍 Generate Snake

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark
            assets/snake-light.svg?palette=github-light

      - name: Commit & Push
        run: |
          git config user.name "mamadiezad"
          git config user.email "mamadiezad@github.com"
          git add assets/snake.svg assets/snake-light.svg
          git diff --staged --quiet || git commit -m "🐍 Auto-generated contribution snake [skip ci]"
          git push
