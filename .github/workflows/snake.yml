name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark
            assets/snake-light.svg?palette=github-light

      - name: Push to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🐍 Auto-generated contribution snake [skip ci]"
          commit_user_name: "mamadiezad"
          commit_user_email: "mamadiezad@github.com"
          file_pattern: assets/snake.svg assets/snake-light.svg
